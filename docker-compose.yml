version: "3"

services:
  mongo_db:
    container_name: travelaimongodb
    image: 'mongo:latest'
    restart: always
    volumes:
      - mongo_db:/data/db

  server:
    build: .
    ports:
      - "4000:3000"
    environment:
      APP_NAME: TravelAIDocker
      PORT: 3000
      DB_URI: mongodb://mongo_db:27017/travelai
    depends_on:
      - mongo_db

volumes:
  mongo_db: {}